<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 Lock Box</title>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 50px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 30px;
        }

        /* ==================================================
           WEIGHT DISPLAY
           ================================================== */

        #weightBox {
            background: white;
            width: 300px;
            margin: 0 auto 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        #weightLabel {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #weight {
            font-size: 48px;
            font-weight: bold;
        }

        #weightUnit {
            font-size: 22px;
        }

        #calibration {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        /* ==================================================
           BUTTONS
           ================================================== */

        button {
            display: block;
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #extend {
            background: #4CAF50;
            color: white;
        }

        #retract {
            background: #f44336;
            color: white;
        }

        #stop {
            background: #555;
            color: white;
        }

        #tare {
            background: #2196F3;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==================================================
           STATUS
           ================================================== */

        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        #scaleStatus {
            margin-top: 10px;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <h1>ESP32 Lock Box</h1>


    <!-- ==================================================
         WEIGHT
         ================================================== -->

    <div id="weightBox">

        <div id="weightLabel">
            Current Weight
        </div>

        <span id="weight">
            --.--
        </span>

        <span id="weightUnit">
            g
        </span>

        <div id="calibration">
            Calibration: ----
        </div>

        <div id="scaleStatus">
            ⚪ Scale connecting...
        </div>

    </div>


    <!-- ==================================================
         TARE
         ================================================== -->

    <button id="tare" onclick="fullTare()">
        FULL TARE
    </button>


    <!-- ==================================================
         ACTUATOR
         ================================================== -->

    <button id="extend" onclick="authorizeAndSend('EXTEND')">
        EXTEND
    </button>

    <button id="retract" onclick="authorizeAndSend('RETRACT')">
        RETRACT
    </button>

    <button id="stop" onclick="authorizeAndSend('STOP')">
        STOP
    </button>


    <!-- ==================================================
         MAIN STATUS
         ================================================== -->

    <div id="status">
        Connecting...
    </div>


<script>


// ======================================================
// ESP32 IP ADDRESS
// ======================================================
//
// IMPORTANT:
// Replace this with the IP address shown in your
// Arduino Serial Monitor.
//
// Example:
// const ESP32_IP = "192.168.12.197";
//
// ======================================================

const ESP32_IP = "192.168.12.197";


// ======================================================
// HIVEMQ
// ======================================================

const mqttHost =
    "wss://8a667d6eb5234254958db7ce3a42fa44.s1.eu.hivemq.cloud:8884/mqtt";

const mqttUsername = "web-controller";

const mqttPassword = "esp32run1!";

const mqttTopic = "actuator/control";


// ======================================================
// SOLIDITY CONTRACT
// ======================================================

const contractAddress =
    "0xdF0c26f4EE1F23349534B4e5fe5364d5AC0ed4F3";

const contractABI = [
    "function extend()",
    "function retract()",
    "function stop()"
];


// ======================================================
// MQTT CONNECTION
// ======================================================

const mqttClient = mqtt.connect(mqttHost, {

    username: mqttUsername,

    password: mqttPassword,

    protocol: "wss",

    reconnectPeriod: 2000

});


mqttClient.on("connect", function () {

    console.log("Connected to HiveMQ");

    updateStatus("🟢 Controller ready");

});


mqttClient.on("error", function (error) {

    console.error("MQTT error:", error);

    updateStatus("🔴 MQTT connection error");

});


mqttClient.on("offline", function () {

    updateStatus("🟡 Controller offline");

});


// ======================================================
// STATUS
// ======================================================

function updateStatus(message) {

    document.getElementById("status").innerText = message;

}


// ======================================================
// READ ESP32 WEIGHT
// ======================================================

async function updateWeight() {

    try {

        const response = await fetch(
            "http://" + ESP32_IP + "/weight"
        );

        if (!response.ok) {

            throw new Error(
                "HTTP error " + response.status
            );

        }

        const data = await response.json();


        // ----------------------------------------------
        // DISPLAY WEIGHT
        // ----------------------------------------------

        document.getElementById("weight").innerText =
            Number(data.weight).toFixed(2);


        // ----------------------------------------------
        // DISPLAY CALIBRATION
        // ----------------------------------------------

        document.getElementById("calibration").innerText =
            "Calibration: " +
            Number(data.calibration).toFixed(2);


        // ----------------------------------------------
        // SCALE STATUS
        // ----------------------------------------------

        document.getElementById("scaleStatus").innerText =
            "🟢 Scale connected";


    }

    catch (error) {

        console.error(
            "Scale connection error:",
            error
        );

        document.getElementById("scaleStatus").innerText =
            "🔴 Scale disconnected";

    }

}


// ======================================================
// UPDATE WEIGHT
// ======================================================

async function updateWeightLoop() {

    await updateWeight();

    // Wait 1 second AFTER the previous request finishes
    setTimeout(updateWeightLoop, 1000);
}


// Start the weight loop
updateWeightLoop();


// ======================================================
// FULL TARE
// ======================================================

async function fullTare() {

    try {

        updateStatus(
            "⚖️ Performing full tare..."
        );


        const response = await fetch(
            "http://" + ESP32_IP + "/full-tare"
        );


        if (!response.ok) {

            throw new Error(
                "Tare failed"
            );

        }


        const data = await response.json();


        console.log(
            "Tare response:",
            data
        );


        updateStatus(
            "✅ Full tare complete"
        );


        // Immediately update weight
        updateWeight();


    }

    catch (error) {

        console.error(
            "Tare error:",
            error
        );


        updateStatus(
            "🔴 Full tare failed"
        );

    }

}


// ======================================================
// META MASK + SOLIDITY + MQTT
// ======================================================

async function authorizeAndSend(command) {

    try {

        // ----------------------------------------------
        // MAKE SURE METAMASK EXISTS
        // ----------------------------------------------

        if (!window.ethereum) {

            alert(
                "MetaMask is not installed."
            );

            return;
        }


        // ----------------------------------------------
        // MAKE SURE MQTT IS CONNECTED
        // ----------------------------------------------

        if (!mqttClient.connected) {

            updateStatus(
                "🔴 MQTT is not connected."
            );

            return;
        }


        updateStatus(
            "🦊 Opening MetaMask..."
        );


        // ----------------------------------------------
        // CONNECT TO METAMASK
        // ----------------------------------------------

        const provider =
            new ethers.BrowserProvider(
                window.ethereum
            );


        await provider.send(
            "eth_requestAccounts",
            []
        );


        // ----------------------------------------------
        // CHECK NETWORK
        // ----------------------------------------------

        const network =
            await provider.getNetwork();


        // Sepolia chain ID = 11155111
        if (network.chainId !== 11155111n) {

            updateStatus(
                "🔴 Switch MetaMask to Sepolia."
            );

            alert(
                "Please switch MetaMask to the Sepolia Testnet."
            );

            return;
        }


        // ----------------------------------------------
        // GET SIGNER
        // ----------------------------------------------

        const signer =
            await provider.getSigner();


        // ----------------------------------------------
        // CREATE CONTRACT
        // ----------------------------------------------

        const contract =
            new ethers.Contract(
                contractAddress,
                contractABI,
                signer
            );


        updateStatus(
            "🦊 Approve " +
            command +
            " in MetaMask..."
        );


        // ----------------------------------------------
        // CALL SOLIDITY FUNCTION
        // ----------------------------------------------

        let transaction;


        if (command === "EXTEND") {

            transaction =
                await contract.extend();

        }

        else if (command === "RETRACT") {

            transaction =
                await contract.retract();

        }

        else if (command === "STOP") {

            transaction =
                await contract.stop();

        }


        console.log(
            "Blockchain transaction:",
            transaction.hash
        );


        updateStatus(
            "⛓️ Waiting for blockchain confirmation..."
        );


        // ----------------------------------------------
        // WAIT FOR SEPOLIA CONFIRMATION
        // ----------------------------------------------

        await transaction.wait();


        console.log(
            "Blockchain transaction confirmed."
        );


        // ----------------------------------------------
        // SEND MQTT COMMAND
        // ----------------------------------------------

        updateStatus(
            "📡 Sending " +
            command +
            " to ESP32..."
        );


        mqttClient.publish(

            mqttTopic,

            command,

            {
                qos: 0
            },

            function(error) {

                if (error) {

                    console.error(error);

                    updateStatus(
                        "🔴 MQTT command failed."
                    );

                }

                else {

                    updateStatus(
                        "✅ " +
                        command +
                        " sent to ESP32"
                    );

                }

            }

        );


    }

    catch (error) {

        console.error(error);


        updateStatus(
            "❌ Transaction cancelled or failed"
        );

    }

}


</script>

</body>
</html>
