<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 Lock Box</title>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 50px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 30px;
        }

        /* ==================================================
           WEIGHT DISPLAY
           ================================================== */

        #weightBox {
            background: white;
            width: 300px;
            margin: 0 auto 30px auto;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
        }

        #weightLabel {
            font-size: 18px;
            margin-bottom: 10px;
        }

        #weight {
            font-size: 48px;
            font-weight: bold;
        }

        #weightUnit {
            font-size: 22px;
        }

        #calibration {
            margin-top: 10px;
            font-size: 14px;
            color: #666;
        }

        /* ==================================================
           BUTTONS
           ================================================== */

        button {
            display: block;
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #extend {
            background: #4CAF50;
            color: white;
        }

        #retract {
            background: #f44336;
            color: white;
        }

        #stop {
            background: #555;
            color: white;
        }

        #tare {
            background: #2196F3;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* ==================================================
           STATUS
           ================================================== */

        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
        }

        #scaleStatus {
            margin-top: 10px;
            font-size: 16px;
        }

    </style>
</head>

<body>

    <h1>ESP32 Lock Box</h1>


    <!-- ==================================================
         WEIGHT
         ================================================== -->

    <div id="weightBox">

        <div id="weightLabel">
            Current Weight
        </div>

        <span id="weight">
            --.--
        </span>

        <span id="weightUnit">
            g
        </span>

        <div id="calibration">
            Calibration: ----
        </div>

        <div id="scaleStatus">
            ⚪ Scale connecting...
        </div>

    </div>


    <!-- ==================================================
         TARE
         ================================================== -->

    <button id="tare" onclick="fullTare()">
        FULL TARE
    </button>


    <!-- ==================================================
         ACTUATOR
         ================================================== -->

    <button id="extend" onclick="authorizeAndSend('EXTEND')">
        EXTEND
    </button>

    <button id="retract" onclick="authorizeAndSend('RETRACT')">
        RETRACT
    </button>

    <button id="stop" onclick="authorizeAndSend('STOP')">
        STOP
    </button>


    <!-- ==================================================
         MAIN STATUS
         ================================================== -->

    <div id="status">
        Connecting...
    </div>


<script>



// ======================================================
// HIVEMQ
// ======================================================

const mqttHost =
    "wss://8a667d6eb5234254958db7ce3a42fa44.s1.eu.hivemq.cloud:8884/mqtt";

// WEBSITE MQTT CREDENTIALS
// Enter the passwords for the two HiveMQ credentials you created.
// Do NOT share these passwords publicly.


const mqttTopic = "actuator/control";
const weightTopic = "scale/weight";
const tareTopic = "scale/tare";

// Latest weight received from the ESP32 through MQTT.
let currentWeight = null;


// ======================================================
// SOLIDITY CONTRACT
// ======================================================

const contractAddress = "0x1B2324EDe0910FFcD9F7ee752E0a8B67A62c8D96";

const contractABI = [
    "function retract(uint256 weight) payable",
    "function extend(uint256 weight)",
    "function stop()",
    "function getBalance() view returns (uint256)",
    "function initialWeight() view returns (uint256)",
    "function remainingWeight() view returns (uint256)",
    "function amountPaid() view returns (uint256)",
    "function boxLocked() view returns (bool)"
];

// ======================================================
// WEIGHT VIA RENDER
// ======================================================

// Get the latest weight from the private Render server.
async function getWeight() {

    try {

        const response = await fetch(
            "https://weightbox-server.onrender.com/api/weight"
        );

        if (!response.ok) {
            throw new Error("Weight server request failed");
        }

        const data = await response.json();

        if (!Number.isFinite(Number(data.weight))) {
            throw new Error("Invalid weight received");
        }

        currentWeight = Number(data.weight);

        document.getElementById("weight").innerText =
            currentWeight.toFixed(2);

        document.getElementById("calibration").innerText =
            "Calibration: 1634.20";

        document.getElementById("scaleStatus").innerText =
            "🟢 Scale connected";

    }

    catch (error) {

        console.error("Weight server error:", error);

        document.getElementById("scaleStatus").innerText =
            "🔴 Scale server error";

    }

}


// Get the latest weight every 500 milliseconds.
setInterval(getWeight, 500);


// Get the first weight immediately.
getWeight();

// ======================================================
// STATUS
// ======================================================

function updateStatus(message) {

    document.getElementById("status").innerText = message;

}



// ======================================================
// FULL TARE
// ======================================================

async function fullTare() {

    updateStatus(
        "⚖️ Performing full tare..."
    );

    try {

        const response = await fetch(
            "https://weightbox-server.onrender.com/api/tare",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                }
            }
        );

        if (!response.ok) {

            const errorText = await response.text();

            console.error("TARE server error:", errorText);

            updateStatus(
                "🔴 Full tare failed"
            );

            return;
        }

        const result = await response.json();

        if (result.success) {

            updateStatus(
                "✅ Full tare command sent"
            );

        } else {

            updateStatus(
                "🔴 Full tare failed"
            );

        }

    }

    catch (error) {

        console.error("TARE server error:", error);

        updateStatus(
            "🔴 Full tare failed"
        );

    }

}


// ======================================================
// META MASK + SOLIDITY + RENDER
// ======================================================

async function authorizeAndSend(command) {

    try {

        // ----------------------------------------------
        // MAKE SURE METAMASK EXISTS
        // ----------------------------------------------

        if (!window.ethereum) {

            alert(
                "MetaMask is not installed."
            );

            return;
        }


        // ----------------------------------------------
        // MAKE SURE MQTT IS CONNECTED
        // ----------------------------------------------


        updateStatus(
            "🦊 Opening MetaMask..."
        );


        // ----------------------------------------------
        // CONNECT TO METAMASK
        // ----------------------------------------------

        const provider =
            new ethers.BrowserProvider(
                window.ethereum
            );


        await provider.send(
            "eth_requestAccounts",
            []
        );


        // ----------------------------------------------
        // CHECK NETWORK
        // ----------------------------------------------

        const network =
            await provider.getNetwork();


        // Sepolia chain ID = 11155111
        if (network.chainId !== 11155111n) {

            updateStatus(
                "🔴 Switch MetaMask to Sepolia."
            );

            alert(
                "Please switch MetaMask to the Sepolia Testnet."
            );

            return;
        }


        // ----------------------------------------------
        // GET SIGNER
        // ----------------------------------------------

        const signer =
            await provider.getSigner();


        // ----------------------------------------------
        // CREATE CONTRACT
        // ----------------------------------------------

        const contract =
            new ethers.Contract(
                contractAddress,
                contractABI,
                signer
            );


        updateStatus(
            "🦊 Approve " +
            command +
            " in MetaMask..."
        );


        // ----------------------------------------------
        // CALL SOLIDITY FUNCTION
        // ----------------------------------------------

        let transaction;

        // The deployed Solidity contract expects an integer number of grams.
        // The scale displays two decimal places, so use the nearest whole gram.
                if (command === "EXTEND") {

            if (currentWeight === null || !Number.isFinite(currentWeight)) {
                updateStatus("🔴 No scale weight received yet.");
                return;
            }

            const weightGrams = Math.round(currentWeight);

            transaction =
                await contract.extend(weightGrams);

        }

else if (command === "RETRACT") {

    if (currentWeight === null || !Number.isFinite(currentWeight)) {
        updateStatus("🔴 No scale weight received yet.");
        return;
    }

    const retractWeight = Math.max(
        0,
        Math.round(currentWeight)
    );

    const paymentAmount =
        ethers.parseEther(
            (retractWeight * 0.0125).toFixed(4)
        );

    transaction =
        await contract.retract(retractWeight, {
            value: paymentAmount
        });

}

        else if (command === "STOP") {

            transaction =
                await contract.stop();

        }


        console.log(
            "Blockchain transaction:",
            transaction.hash
        );


        updateStatus(
            "⛓️ Waiting for blockchain confirmation..."
        );


        // ----------------------------------------------
        // WAIT FOR SEPOLIA CONFIRMATION
        // ----------------------------------------------

        await transaction.wait();


        console.log(
            "Blockchain transaction confirmed."
        );


        // ----------------------------------------------
        // SEND MQTT COMMAND
        // ----------------------------------------------

        updateStatus(
            "📡 Sending " +
            command +
            " to ESP32..."
        );


        const response = await fetch(
    "https://weightbox-server.onrender.com/api/actuator",
    {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({
            command: command
        })
    }
);

if (!response.ok) {

    const errorText = await response.text();

    console.error("Server error:", errorText);

    updateStatus("🔴 Server failed to send command.");
    return;
}

const result = await response.json();

if (result.success) {

    updateStatus(
        "✅ " +
        command +
        " sent to ESP32"
    );

} else {

    updateStatus("🔴 Server failed to send command.");

}

    catch (error) {

        console.error(error);


        updateStatus(
            "❌ Transaction cancelled or failed"
        );

    }

}


</script>

</body>
</html>
