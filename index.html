<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 Actuator Control</title>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <!-- Ethers.js -->
    <script src="https://cdn.jsdelivr.net/npm/ethers@6.13.5/dist/ethers.umd.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 70px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 40px;
        }

        button {
            display: block;
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #extend {
            background: #4CAF50;
            color: white;
        }

        #retract {
            background: #f44336;
            color: white;
        }

        #stop {
            background: #555;
            color: white;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>ESP32 Actuator Control</h1>

    <button id="extend" onclick="authorizeAndSend('EXTEND')">
        EXTEND
    </button>

    <button id="retract" onclick="authorizeAndSend('RETRACT')">
        RETRACT
    </button>

    <button id="stop" onclick="authorizeAndSend('STOP')">
        STOP
    </button>

    <div id="status">
        Connecting...
    </div>


<script>

// ======================================================
// HIVEMQ
// ======================================================

const mqttHost =
    "wss://8a667d6eb5234254958db7ce3a42fa44.s1.eu.hivemq.cloud:8884/mqtt";

const mqttUsername = "web-controller";

const mqttPassword = "esp32run1!";

const mqttTopic = "actuator/control";


// ======================================================
// SOLIDITY CONTRACT
// ======================================================

const contractAddress =
    "0xdF0c26f4EE1F23349534B4e5fe5364d5AC0ed4F3";

const contractABI = [
    "function extend()",
    "function retract()",
    "function stop()"
];


// ======================================================
// MQTT CONNECTION
// ======================================================

const mqttClient = mqtt.connect(mqttHost, {

    username: mqttUsername,
    password: mqttPassword,

    protocol: "wss",

    reconnectPeriod: 2000
});


mqttClient.on("connect", function () {

    console.log("Connected to HiveMQ");

    updateStatus("🟢 Controller ready");

});


mqttClient.on("error", function (error) {

    console.error("MQTT error:", error);

    updateStatus("🔴 MQTT connection error");

});


mqttClient.on("offline", function () {

    updateStatus("🟡 Controller offline");

});


// ======================================================
// STATUS
// ======================================================

function updateStatus(message) {

    document.getElementById("status").innerText = message;

}


// ======================================================
// META MASK + SOLIDITY + MQTT
// ======================================================

async function authorizeAndSend(command) {

    try {

        // Make sure MetaMask exists
        if (!window.ethereum) {

            alert("MetaMask is not installed.");

            return;
        }


        // Make sure MQTT is connected
        if (!mqttClient.connected) {

            updateStatus("🔴 MQTT is not connected.");

            return;
        }


        updateStatus("🦊 Opening MetaMask...");


        // Connect to MetaMask
        const provider =
            new ethers.BrowserProvider(window.ethereum);


        // Request wallet connection
        await provider.send(
            "eth_requestAccounts",
            []
        );


        // Check network
        const network =
            await provider.getNetwork();


        // Sepolia chain ID = 11155111
        if (network.chainId !== 11155111n) {

            updateStatus("🔴 Switch MetaMask to Sepolia.");

            alert("Please switch MetaMask to the Sepolia Testnet.");

            return;
        }


        // Get signer
        const signer =
            await provider.getSigner();


        // Create contract
        const contract =
            new ethers.Contract(
                contractAddress,
                contractABI,
                signer
            );


        updateStatus(
            "🦊 Approve " + command + " in MetaMask..."
        );


        // ==================================================
        // CALL SOLIDITY FUNCTION
        // ==================================================

        let transaction;


        if (command === "EXTEND") {

            transaction = await contract.extend();

        }

        else if (command === "RETRACT") {

            transaction = await contract.retract();

        }

        else if (command === "STOP") {

            transaction = await contract.stop();

        }


        console.log(
            "Blockchain transaction:",
            transaction.hash
        );


        updateStatus(
            "⛓️ Waiting for blockchain confirmation..."
        );


        // Wait for Sepolia confirmation
        await transaction.wait();


        console.log(
            "Blockchain transaction confirmed."
        );


        // ==================================================
        // SEND MQTT COMMAND
        // ==================================================

        updateStatus(
            "📡 Sending " + command + " to ESP32..."
        );


        mqttClient.publish(
            mqttTopic,
            command,
            {
                qos: 0
            },
            function(error) {

                if (error) {

                    console.error(error);

                    updateStatus(
                        "🔴 MQTT command failed."
                    );

                }

                else {

                    updateStatus(
                        "✅ " + command + " sent to ESP32"
                    );

                }

            }
        );


    }

    catch (error) {

        console.error(error);

        updateStatus(
            "❌ Transaction cancelled or failed"
        );

    }

}

</script>

</body>
</html>
