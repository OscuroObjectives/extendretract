<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ESP32 Actuator Control</title>

    <!-- MQTT.js -->
    <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin: 0;
            padding-top: 70px;
            background: #f4f4f4;
        }

        h1 {
            margin-bottom: 40px;
        }

        button {
            display: block;
            width: 250px;
            padding: 20px;
            margin: 20px auto;
            font-size: 24px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        #extend {
            background: #4CAF50;
            color: white;
        }

        #retract {
            background: #f44336;
            color: white;
        }

        #stop {
            background: #555;
            color: white;
        }

        button:active {
            transform: scale(0.97);
        }

        #status {
            margin-top: 30px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <h1>ESP32 Actuator Control</h1>

    <button id="extend" onclick="sendCommand('EXTEND')">
        EXTEND
    </button>

    <button id="retract" onclick="sendCommand('RETRACT')">
        RETRACT
    </button>

    <button id="stop" onclick="sendCommand('STOP')">
        STOP
    </button>

    <div id="status">
        Connecting to controller...
    </div>


    <script>

        // ==================================================
        // HIVEMQ SETTINGS
        // ==================================================

        const mqttHost =
            "wss://8a667d6eb5234254958db7ce3a42fa44.s1.eu.hivemq.cloud:8884/mqtt";

        const mqttUsername = "web-controller";

        const mqttPassword = "esp32run1!";

        const mqttTopic = "actuator/control";


        // ==================================================
        // CONNECT TO HIVEMQ
        // ==================================================

        const client = mqtt.connect(mqttHost, {

            username: mqttUsername,

            password: mqttPassword,

            protocol: "wss",

            reconnectPeriod: 2000
        });


        // ==================================================
        // CONNECTION EVENTS
        // ==================================================

        client.on("connect", function () {

            console.log("Connected to HiveMQ");

            document.getElementById("status").innerText =
                "🟢 Connected to controller";

        });


        client.on("error", function (error) {

            console.error("MQTT error:", error);

            document.getElementById("status").innerText =
                "🔴 Connection error";

        });


        client.on("offline", function () {

            document.getElementById("status").innerText =
                "🟡 Controller offline";

        });


        // ==================================================
        // SEND ACTUATOR COMMAND
        // ==================================================

        function sendCommand(command) {

            if (!client.connected) {

                document.getElementById("status").innerText =
                    "🔴 Not connected";

                return;
            }

            client.publish(
                mqttTopic,
                command,
                {
                    qos: 0
                },
                function (error) {

                    if (error) {

                        console.error(error);

                        document.getElementById("status").innerText =
                            "🔴 Command failed";

                    } else {

                        document.getElementById("status").innerText =
                            "Command sent: " + command;

                        console.log("Sent:", command);
                    }
                }
            );
        }

    </script>

</body>
</html>
